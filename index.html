let mode=1,order=[],idx=0,score=0,locked=false;
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){order=shuffle(words.map((_,i)=>i));idx=0;score=0;locked=false;$('results').classList.add('hidden');$('exercise').classList.remove('hidden');render()}
function switchMode(m){mode=m;$('tab1').classList.toggle('active',m===1);$('tab2').classList.toggle('active',m===2);start()}
function speak(text){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.82;window.speechSynthesis.speak(u)}
function render(){locked=false;$('feedback').textContent='';$('feedback').className='feedback';$('actions').innerHTML='';if(idx>=order.length){finish();return}const item=words[order[idx]];$('count').textContent=`Question ${idx+1} of ${order.length}`;$('score').textContent=`Score: ${score}`;$('bar').style.width=`${idx/order.length*100}%`;
if(mode===1){$('task').innerHTML=`<div class="prompt">Choose the picture for:</div><div class="prompt target">${item.w}</div><div class="choices" id="choices"></div>`;const opts=shuffle([item,...shuffle(words.filter((_,i)=>i!==order[idx])).slice(0,2)]);opts.forEach(opt=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<img src="${opt.img}" alt="${opt.vi}"><span class="meaning">${opt.vi}</span><span>🔊 Listen</span>`;b.onclick=()=>{speak(opt.w);if(locked)return;locked=true;const correct=opt===item;if(correct){score++;b.classList.add('correct');$('feedback').textContent='Correct!';$('feedback').className='feedback good'}else{b.classList.add('wrong');$('feedback').textContent='Incorrect.';$('feedback').className='feedback bad'}document.querySelectorAll('.choice').forEach(x=>x.disabled=true);opts.forEach((o,j)=>{if(o===item)$('choices').children[j].classList.add('correct')});$('score').textContent=`Score: ${score}`;nextButton()};$('choices').appendChild(b)})}
else{$('task').innerHTML=`<div class="prompt">Write the English word or phrase.</div><div class="bigpic" onclick="speak(words[order[idx]].w)"><img src="${item.img}" alt="${item.vi}"></div><div class="prompt target">${item.vi}</div><div class="typebox"><input id="answer" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Type your answer" placeholder="Type your answer here"><div class="hint">Tap the picture to hear the pronunciation.</div></div>`;$('actions').innerHTML='<button onclick="checkTyped()">Check</button><button class="skip" onclick="skipTyped()">Skip</button><button class="secondary" onclick="speak(words[order[idx]].w)">🔊 Listen</button>';$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')checkTyped()});setTimeout(()=>$('answer').focus(),50)}}
function nextButton(){$('actions').innerHTML='<button onclick="next()">Next</button>'}
function checkTyped(){if(locked)return;const item=words[order[idx]],val=$('answer').value.trim();if(!val){$('feedback').textContent='Type an answer or choose Skip.';return}locked=true;if(val.toLowerCase()===item.w.toLowerCase()){score++;$('feedback').textContent='Correct!';$('feedback').className='feedback good'}else{$('feedback').textContent=`Incorrect. Correct answer: ${item.w}`;$('feedback').className='feedback bad'}$('score').textContent=`Score: ${score}`;$('answer').disabled=true;nextButton()}
function skipTyped(){if(locked)return;locked=true;$('feedback').textContent=`Skipped. Correct answer: ${words[order[idx]].w}`;$('feedback').className='feedback bad';$('answer').disabled=true;nextButton()}
function next(){idx++;render()}
function finish(){$('exercise').classList.add('hidden');$('results').classList.remove('hidden');$('results').innerHTML=`<h2>Exercise Complete!</h2><p>Your score: <strong>${score} / ${order.length}</strong></p><button onclick="start()">Try Again</button>`}
start();
</script></body></html>
